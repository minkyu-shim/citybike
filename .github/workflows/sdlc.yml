name: sdlc
on:
  pull_request:
    branches: [main]

env:
  IMAGE: citybike:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GITHUB_SHA=${{ github.sha }} -t $IMAGE .
      - name: Save image
        run: docker save $IMAGE -o /tmp/citybike.tar
      - uses: actions/upload-artifact@v4
        with:
          name: citybike-image
          path: /tmp/citybike.tar
          retention-days: 1

  staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - run: docker load -i /tmp/citybike.tar
      - name: Start container
        run: docker run -d --name citybike-gate -p 4174:4173 -e APP_ENV=staging $IMAGE
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4174/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs citybike-gate; exit 1
      - name: Staging gate
        run: TARGET_URL=http://localhost:4174 ./scripts/test-staging.sh
      - name: Clean up
        if: always()
        run: docker rm -f citybike-gate || true

  uat:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - run: docker load -i /tmp/citybike.tar
      - name: Start container
        run: docker run -d --name citybike-gate -p 4174:4173 -e APP_ENV=uat $IMAGE
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4174/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs citybike-gate; exit 1
      - name: UAT gate
        run: TARGET_URL=http://localhost:4174 ./scripts/test-uat.sh
      - name: Clean up
        if: always()
        run: docker rm -f citybike-gate || true

  oat:
    needs: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - run: docker load -i /tmp/citybike.tar
      - name: Start container
        run: docker run -d --name citybike-gate -p 4174:4173 -e APP_ENV=oat $IMAGE
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4174/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs citybike-gate; exit 1
      - name: OAT gate
        run: TARGET_URL=http://localhost:4174 ./scripts/test-oat.sh
      - name: Clean up
        if: always()
        run: docker rm -f citybike-gate || true

  preprod:
    needs: oat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - run: docker load -i /tmp/citybike.tar
      - name: Start container
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: docker run -d --name citybike-gate -p 4174:4173 -e APP_ENV=preprod -e PROD_API_KEY $IMAGE
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4174/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs citybike-gate; exit 1
      - name: Preprod gate
        run: TARGET_URL=http://localhost:4174 IMAGE_NAME=$IMAGE ./scripts/test-preprod.sh
      - name: Clean up
        if: always()
        run: docker rm -f citybike-gate || true

  prod:
    needs: preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - run: docker load -i /tmp/citybike.tar
      - name: Deploy to prod
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: docker run -d --name citybike-prod -p 4173:4173 -e APP_ENV=production -e PROD_API_KEY $IMAGE
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs citybike-prod; exit 1
      - name: Prod gate
        run: TARGET_URL=http://localhost:4173 ./scripts/test-prod.sh
